note: >-
  Standards conformance here is about the navigation/robotics stack ANELLO
  actually interoperates with, transcribed from its own documentation and
  repositories. The web-API standards are listed as non-conforming because
  ANELLO exposes no HTTP surface at all — that is an accurate description of an
  embedded product, not a deficiency finding.
standards:
- id: rtcm-10403
  name: RTCM STANDARD 10403 binary envelope
  conforms: true
  evidence: >-
    "The binary packets use an RTCM standard 10403 envelope for each message" —
    preamble 0xD3, 6-bit reserved, 10-bit length, payload, 3-byte CRC.
  source: https://docs-a1.readthedocs.io/en/latest/communication_messaging.html
- id: rtcm-3.3-msm
  name: RTCM 3.3 Multiple Signal Messages (MSM4/MSM5/MSM7)
  conforms: true
  role: consumer
  evidence: >-
    "Standard RTCM3.3 in MSM format, including MSM4, MSM5, and MSM7 messages,
    are supported" as correction input on the data port for RTK.
- id: ntrip
  name: NTRIP (Networked Transport of RTCM via Internet Protocol)
  conforms: true
  role: client
  evidence: >-
    NTRIP client shipped in the ANELLO Python Program and in the ROS driver;
    `ntrip` unit-configuration parameter selects the input channel (0 off, 1
    serial, 2 UDP).
- id: nmea-0183
  name: NMEA 0183 sentences
  conforms: true
  role: producer
  evidence: >-
    NMEA output on the configuration port from firmware v1.2; the `nmea`
    configuration parameter is a bitfield selecting GGA (bit 0), GSA (bit 1)
    and RMC (bit 2).
- id: mavlink
  name: MAVLink
  conforms: true
  evidence: >-
    Maritime INS firmware upload and configuration are performed over MAVLink
    (default udp:0.0.0.0:14550) by ANELLO_INS_Scripts.
  source: https://github.com/Anello-Photonics/ANELLO_INS_Scripts
- id: ros1
  name: ROS 1 (catkin)
  conforms: true
  evidence: >-
    First-party ANELLO_ROS_Driver with package.xml, CMakeLists.txt and nine
    .msg plus three .srv interface definitions.
  artifacts: ros/anello-photonics-ros-interfaces.yml
- id: ros2
  name: ROS 2
  conforms: true
  evidence: '"For ROS2 support, see the ros2_main branch." — ANELLO_ROS_Driver readme.'
- id: px4
  name: PX4 autopilot
  conforms: true
  evidence: >-
    X3 IMU documented with PX4/Pixhawk integration; handheld calibration script
    emits PX4 EKF2_PDR_* parameters; Listener_Topics.py browses PX4 topics.
- id: ardupilot
  name: ArduPilot
  conforms: true
  evidence: >-
