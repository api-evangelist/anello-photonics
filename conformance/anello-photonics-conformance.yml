- id: rs-232
  name: TIA/EIA RS-232
  conforms: true
  evidence: 'Ground INS and Ground IMU RS-232 links, +/- 7V, 8-N-1, 230400 baud default.'
- id: ulog
  name: PX4 ULog (.ulg)
  conforms: true
  role: consumer
  evidence: anello-handheld-scripts reads .ulg logs via ulog2csv/pyulog.
