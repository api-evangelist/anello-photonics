apis:
- name: ANELLO Device Messaging Protocol
  description: 'The ANELLO device interface: an ASCII sentence protocol (#APIMU, #APIM1,
    #APGPS, #APHDG, #APINS, #APAHRS output; #APCFG, #APVEH, #APODO, #APPNG, #APECH,
    #APRST input) plus an RTCM 10403 binary framing, carried over RS-232 serial, USB-C
    virtual COM and UDP/Ethernet. There is no HTTP base URL — this is an embedded
    wire protocol, not a web API — so baseURL is deliberately omitted rather than
    fabricated.'
  humanURL: https://docs-a1.readthedocs.io/en/latest/communication_messaging.html
