aid: anello-photonics
name: ANELLO Photonics
description: 'ANELLO Photonics is a Santa Clara, California company building solid-state,
  high-precision inertial navigation and sensing products for positioning, navigation
  and orientation when GNSS is jammed, spoofed, blocked or otherwise unavailable. Its
  products are powered by SiPhOG (Silicon Photonics Optical Gyroscope), a chip-scale
  optical gyroscope built on standard semiconductor processes. The developer surface
  is an embedded one rather than a web API: ANELLO Ground INS, Ground IMU, Maritime
  INS, Aerial INS, X3 IMU and the Evaluation Kit expose a documented ASCII and RTCM-binary
  message protocol over RS-232 serial, USB-C and UDP/Ethernet, with a public developer
  manual, a first-party Python configuration and logging tool, a ROS/ROS2 driver that
  publishes machine-readable .msg/.srv interface definitions, and PX4/ArduPilot and
  MAVLink integrations.'
