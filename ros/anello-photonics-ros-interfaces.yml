services:
- file: cmd_and_rsp.srv
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/srv/cmd_and_rsp.srv
  request: [{name: command, type: string}]
  response: [{name: response, type: string}]
  note: >-
    Generic passthrough for the ASCII command surface (#APCFG / #APVEH / #APPNG /
    #APECH / #APRST). The request is an ANELLO sentence and the response is the
    unit's raw reply, including any #APERR,<code> error sentence.
- file: set_heading_no_unc.srv
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/srv/set_heading_no_unc.srv
  request: [{name: heading, type: float32}]
  response: [{name: is_success, type: bool}, {name: message, type: string}]
- file: set_heading_with_unc.srv
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/srv/set_heading_with_unc.srv
  request:
  - {name: heading, type: float32, units: degrees}
  - {name: heading_uncertainty, type: float32, units: degrees}
  response: [{name: is_success, type: bool}, {name: message, type: string}]

divergence:
  ros_only: [APCOV, APHEALTH]
  wire_only: [APCFG, APVEH, APPNG, APECH, APRST]
  note: >-
    The ROS surface and the ASCII wire surface are overlapping but not identical
    projections of the same data core. Covariance and health are published only
    over ROS; the configuration and utility sentences are reachable over ROS only
    through the generic cmd_and_rsp service.

