  wire_message: APGPS
  fields: [mcu_time, gps_time, lat, lon, alt_ellipsoid, alt_msl, speed, heading,
    hacc, vacc, pdop, fix_type, sat_num, speed_accuracy, heading_accuracy, rtk_fix_status]
  types: {fix_type: uint8, sat_num: uint8, rtk_fix_status: uint8, default: float64}
- file: APHDG.msg
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/msg/APHDG.msg
  wire_message: APHDG
  fields: [mcu_time, gps_time, rel_pos_n, rel_pos_e, rel_pos_d, rel_pos_length,
    rel_pos_heading, rel_pos_length_accuracy, rel_pos_heading_accuracy, status_flags,
    gnss_fix_ok, diff_soln, rel_pos_valid, carrier_solution, is_moving, ref_pos_miss,
    ref_obs_miss, rel_pos_heading_valid, rel_pos_normalized]
  note: >-
    The driver decomposes the wire `flags` bitfield into named uint8 fields
    alongside the raw uint16 status_flags — a genuine improvement over the ASCII
    sentence.
- file: APINS.msg
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/msg/APINS.msg
  wire_message: APINS
  fields: [mcu_time, gps_time, ins_status, lat, lon, Alt_ellipsoid, vn, ve, vd,
    roll, pitch, heading, zupt]
  types: {ins_status: uint8, zupt: uint8, default: float64}
- file: APAHRS.msg
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/msg/APAHRS.msg
  wire_message: APAHRS
  fields: [mcu_time, sync_time, roll, pitch, heading, zupt]
  types: {zupt: uint8, default: float64}
- file: APCOV.msg
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/msg/APCOV.msg
  wire_message: null
  fields: [mcu_time, cov_lat_lat, cov_lon_lon, cov_alt_alt, cov_lat_lon, cov_lat_alt,
    cov_lon_alt, cov_vn_vn, cov_ve_ve, cov_vd_vd, cov_vn_ve, cov_vn_vd, cov_ve_vd,
    cov_roll_roll, cov_pitch_pitch, cov_heading_heading, cov_roll_pitch,
    cov_roll_heading, cov_pitch_heading]
  types: {all: float64}
  note: >-
