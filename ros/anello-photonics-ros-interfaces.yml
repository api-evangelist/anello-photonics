generated: '2026-08-06'
method: searched
source: https://github.com/Anello-Photonics/ANELLO_ROS_Driver
raw_base: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main
license: MIT
summary: >-
  ANELLO publishes no OpenAPI, GraphQL SDL or AsyncAPI — but it does publish a
  machine-readable interface definition set: the ROS message (.msg) and service
  (.srv) IDL files that ship in the first-party ANELLO_ROS_Driver. These are the
  strongest machine-readable contract on ANELLO's developer surface and are
  harvested here verbatim. Each .msg is a typed projection of the corresponding
  ASCII sentence documented in data-model/anello-photonics-data-model.yml; the
  .srv files are the only request/response pairs ANELLO defines anywhere.
idl: ROS interface definition (rosidl)
ros_versions: [ROS 1 (catkin, main branch), ROS 2 (ros2_main branch)]
supported_firmware: '>= v1.1.1'
supported_products: [ANELLO EVK, ANELLO Ground INS (GNSS INS), ANELLO Ground IMU (IMU+)]

messages:
