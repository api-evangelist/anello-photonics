- file: APHEALTH.msg
  raw: https://raw.githubusercontent.com/Anello-Photonics/ANELLO_ROS_Driver/main/msg/APHEALTH.msg
  wire_message: null
  fields: [position_acc_flag, heading_health_flag, gyro_health_flag]
  types: {all: uint8}
